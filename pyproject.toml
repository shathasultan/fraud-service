[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-service"
version = "0.1.0"
description = "Raqib Fraud Detection Service (SDA-AIE-113 course project)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
api = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pandas-stubs>=2.2.0",
    "import-linter>=2.0",
]

# --- src-layout: package code lives under src/, tests import the
# --- INSTALLED package (pip install -e .), never the repo folder.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, pure-logic tests",
    "integration: API tests via TestClient",
    "behavioural: tests against the real model",
    "slow: excluded from the per-commit gate",
]
addopts = "-q --strict-markers --cov=fraud_service --cov-branch --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80

[tool.coverage.run]
# batch.py is the offline composition-root script (like a __main__ entrypoint) —
# the graded scope is domain/service/api, exercised through the API tests above.
omit = ["*/batch.py"]

[tool.ruff]
line-length = 100
src = ["src"]

# --- Architecture contract -------------------------------------------------
# The same four layers respected by hand since Day 1 (api -> adapters ->
# service -> domain, never the reverse), now machine-enforced. From this
# commit on, a domain module importing from fraud_service.api fails the lint
# job in seconds instead of waiting for whichever reviewer happens to notice.
[tool.importlinter]
root_package = "fraud_service"

[[tool.importlinter.contracts]]
name = "Clean architecture layers"
type = "layers"
layers = [
    "fraud_service.api",
    "fraud_service.adapters",
    "fraud_service.service",
    "fraud_service.domain",
]
